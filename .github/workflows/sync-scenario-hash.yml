name: Sync scenario data hash

on:
  push:
    paths:
      - 'src/data/scenarios.ts'

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Regenerate scenarios.json + content hash
        run: pnpm exec tsx scripts/dump-scenarios.ts

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/arsonists-ledger/scenarios.json src/data/scenarios-version.ts
          git diff --staged --quiet || git commit -m "chore: sync scenario data hash [skip ci]"
          git push
